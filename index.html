<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>羽毛球活动收款</title>
    <style>
      :root {
        --wechat: #07c160;
        --wechat-dark: #05a957;
        --bg: #f5f6f7;
        --card: #ffffff;
        --soft: #f6f7f8;
        --text: #17191d;
        --muted: #8b9098;
        --line: #edf0f2;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
      }

      body {
        color: var(--text);
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }

      #app-wrapper {
        width: 440px; /* iPhone 17 Pro Max 逻辑宽度基准 */
        transform-origin: top left;
        background: var(--bg);
        min-height: 100vh;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        width: 440px;
        margin: 0 auto;
        min-height: 100vh;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        background: var(--bg);
      }

      .hero {
        padding: 32px 22px 76px;
        color: #fff;
        text-align: center;
        background: linear-gradient(180deg, #14d56f 0%, var(--wechat) 100%);
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 32px);
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: 0.5px;
        opacity: 0.95;
      }

      .main-amount {
        margin-top: 16px;
      }

      .amount-label {
        font-size: 19px;
        font-weight: 600;
        opacity: 0.92;
      }

      .amount-value {
        display: block;
        margin-top: 0;
        font-size: clamp(32px, 8vw, 60px);
        line-height: 1.2;
        font-weight: 900;
        letter-spacing: -0.5px;
      }

      .amount-label-small {
        font-size: 0.67em; /* 约 2/3 大小 */
        font-weight: 600;
        margin-right: 2px;
      }

      .amount-sep {
        margin: 0 4px;
        opacity: 0.6;
      }

      .amount-tip {
        margin: 12px 0 0;
        font-size: 15px;
        opacity: 0.82;
      }

      .content {
        margin-top: -54px;
        padding: 0 16px;
        display: grid;
        gap: 10px;
      }

      .card {
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 10px 30px rgba(32, 38, 46, 0.06);
        overflow: hidden;
      }

      .mode-card {
        padding: 8px;
      }

      .capture-source .mode-card,
      .capture-source .generate-action {
        display: none;
      }

      .capture-source .summary-info-card {
        padding-right: 96px;
      }

      .capture-source .receipt-qr {
        display: block;
      }

      .capture-source .qr-upload-card {
        display: none;
      }

      .capture-source.with-receipt-qr .summary-info-card {
        padding-right: 20px;
      }

      .capture-source.with-receipt-qr .receipt-qr {
        display: none;
      }

      .capture-source.with-receipt-qr .hero {
        padding-bottom: 76px;
      }

      .capture-source.with-receipt-qr .generated-qr-card {
        display: block;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        border-radius: 18px;
        background: var(--soft);
        padding: 5px;
      }

      .mode-btn {
        min-height: 38px;
        border: 0;
        border-radius: 14px;
        color: #697077;
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
      }

      .mode-btn.active {
        color: #fff;
        background: var(--wechat);
      }

      .form-card {
        padding: 0;
      }

      .input-row {
        min-height: 50px;
        padding: 0 24px;
        display: grid;
        grid-template-columns: 110px 1fr;
        align-items: center;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        font-size: 17px;
        font-weight: 400;
        white-space: nowrap;
      }

      .input-row > span:first-child {
        font-size: 19px;
        font-weight: 400;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .row-content {
        display: flex;
        align-items: baseline; /* 核心：父容器也必须是 baseline 对齐 */
        justify-content: flex-end;
        gap: 2px;
        min-width: 0;
        font-weight: 400;
        white-space: nowrap;
      }

      .input-row:last-child {
        border-bottom: 0;
      }

      .people-row.equal .female-person,
      .people-row.equal .male-label {
        display: none;
      }

      .people-row.equal {
        justify-content: flex-start;
      }

      .summary-detail {
        padding: 16px;
        background: #fff;
      }

      .summary-info-card {
        position: relative;
        padding: 16px 20px;
        background: #f0f9f4;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
      }

      .summary-item {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 1;
      }

      .summary-icon-box {
        width: 32px;
        height: 32px;
        background: var(--wechat);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      #courtSummaryText,
      #ballSummaryText {
        font-size: 16px;
        font-weight: 400;
        color: var(--text);
      }

      .summary-bg-decor {
        position: absolute;
        right: -10px;
        top: 50%;
        transform: translateY(-50%) rotate(-15deg);
        font-size: 80px;
        opacity: 0.05;
        pointer-events: none;
      }

      .receipt-qr {
        position: absolute;
        right: 14px;
        top: 50%;
        width: 59px;
        height: 59px;
        min-width: 59px;
        min-height: 59px;
        max-width: 59px;
        max-height: 59px;
        aspect-ratio: 1 / 1;
        display: none;
        opacity: 1;
        object-fit: contain;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .generated-qr-card {
        display: none;
        margin: -54px 16px 10px;
        padding: 16px 18px 14px;
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-shadow: 0 10px 30px rgba(32, 38, 46, 0.06);
        overflow: hidden;
        position: relative;
      }

      .generated-qr-box {
        width: 66.666%;
        min-width: 160px;
        aspect-ratio: 825 / 880;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        overflow: hidden;
      }

      .generated-qr-box img {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }

      .qr-emoji {
        position: absolute;
        z-index: 0;
        font-size: 18px;
        opacity: 0.72;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
        pointer-events: none;
        user-select: none;
      }

      .generated-qr-box {
        position: relative;
        z-index: 1;
      }

      .qr-upload-card {
        margin-top: 12px;
        padding: 12px;
        border: 1px dashed #cfd8d3;
        border-radius: 18px;
        background: #f9fbfa;
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 12px;
        align-items: center;
        position: relative;
        z-index: 1;
      }

      .qr-preview {
        position: relative;
        width: 58px;
        height: 58px;
        border-radius: 12px;
        border: 1px solid #e5e9e7;
        background: #fff;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--wechat);
        font-size: 22px;
        font-weight: 800;
      }

      .qr-preview img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }

      .qr-preview span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      .qr-upload-card.has-image .qr-preview img {
        display: block;
      }

      .qr-upload-card.has-image .qr-preview span {
        display: none;
      }

      .qr-upload-info {
        min-width: 0;
        display: grid;
        gap: 7px;
      }

      .qr-upload-title {
        color: var(--text);
        font-size: 16px;
        font-weight: 700;
      }

      .qr-upload-status {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .qr-upload-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .qr-upload-btn,
      .qr-clear-btn {
        min-height: 30px;
        border-radius: 999px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 700;
      }

      .qr-upload-btn {
        border: 0;
        background: var(--wechat);
        color: #fff;
      }

      .qr-clear-btn {
        border: 1px solid #dfe4e8;
        background: #fff;
        color: #5f6870;
        display: none;
      }

      .qr-upload-card.has-image .qr-clear-btn {
        display: inline-flex;
        align-items: center;
      }

      .qr-file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .summary-total-row {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1.5px dashed var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .total-label {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .total-value {
        color: #ff4d4f;
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      .total-value strong {
        font-size: 28px;
        font-weight: 900;
      }

      .total-value .currency {
        font-size: 18px;
        font-weight: 800;
      }

      .inline-input {
        width: 5ch;
        height: 1.2em; /* 显式设置高度与行高匹配 */
        margin: 0 3px;
        padding: 0;
        border: 0;
        border-bottom: 2px solid #d7dde1;
        border-radius: 0;
        color: var(--text);
        background: transparent;
        outline: none;
        font-size: 17px;
        font-weight: 400;
        text-align: center;
        appearance: none;
        -webkit-appearance: none;
        vertical-align: baseline;
        line-height: normal; /* 让浏览器自动处理基线 */
        display: inline-block;
      }

      .inline-input:focus {
        border-bottom-color: var(--wechat);
      }

      .inline-input.short {
        /* 移除特定的宽度覆盖，统一使用 4 个数字宽度 */
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        margin: 0;
        appearance: none;
      }

      .derived-pill {
        margin-left: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        color: var(--wechat-dark);
        background: #e9f8ef;
        font-size: 15px;
        font-weight: 500;
      }

      .result-card {
        padding: 18px 20px;
      }

      .result-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .result-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
      }

      .auto-badge {
        padding: 7px 12px;
        border-radius: 999px;
        color: var(--wechat-dark);
        background: #dff8e9;
        font-size: 13px;
        font-weight: 800;
      }

      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .result-grid.equal {
        grid-template-columns: 1fr;
      }

      .result-box {
        min-height: 92px;
        padding: 14px;
        border-radius: 20px;
        background: var(--soft);
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }

      .result-box.hidden {
        display: none;
      }

      .result-box span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }

      .result-box strong {
        margin-top: 5px;
        font-size: clamp(28px, 6vw, 40px);
        line-height: 1;
        font-weight: 900;
      }

      .footer {
        padding: 8px 0 0;
        color: #7a8088;
        text-align: center;
        font-size: 14px;
      }

      .generate-btn {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 18px;
        color: #fff;
        background: var(--wechat);
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
      }

      .generate-btn:active {
        background: var(--wechat-dark);
      }

      .generate-action {
        padding: 2px 0 0;
        display: grid;
        gap: 10px;
      }

      .qr-generate-option {
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid #dfe4e8;
        border-radius: 16px;
        background: #fff;
        color: #4f5963;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 700;
      }

      .qr-generate-option input {
        width: 18px;
        height: 18px;
        accent-color: var(--wechat);
      }

      .settings-btn {
        width: 100%;
        min-height: 42px;
        border: 1px solid #dfe4e8;
        border-radius: 16px;
        color: #4f5963;
        background: #fff;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
      }

      .settings-panel {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: flex-end;
        justify-content: center;
        padding: 0 12px max(12px, env(safe-area-inset-bottom));
        background: rgba(0, 0, 0, 0.45);
      }

      .settings-panel.show {
        display: flex;
      }

      .settings-dialog {
        width: min(416px, 100%);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .settings-header {
        padding: 18px 20px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .settings-title {
        margin: 0;
        font-size: 19px;
        font-weight: 800;
      }

      .settings-close {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        color: #6e7680;
        background: var(--soft);
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
      }

      .settings-body {
        padding: 4px 20px 2px;
      }

      .settings-title-row {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }

      .settings-title-label {
        margin-bottom: 10px;
        display: block;
        font-size: 17px;
      }

      .settings-title-input {
        width: 100%;
        height: 42px;
        border: 1px solid #dfe4e8;
        border-radius: 12px;
        outline: none;
        padding: 0 12px;
        color: var(--text);
        background: #fff;
        font-size: 16px;
        font-weight: 700;
      }

      .settings-title-input:focus {
        border-color: var(--wechat);
      }

      .settings-mode-row {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }

      .settings-mode-label {
        margin-bottom: 10px;
        display: block;
        font-size: 17px;
      }

      .settings-mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        border-radius: 16px;
        background: var(--soft);
        padding: 5px;
      }

      .settings-mode-btn {
        min-height: 38px;
        border: 0;
        border-radius: 12px;
        color: #697077;
        background: transparent;
        cursor: pointer;
        font-size: 15px;
        font-weight: 800;
      }

      .settings-mode-btn.active {
        color: #fff;
        background: var(--wechat);
      }

      .settings-row {
        min-height: 58px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        font-size: 17px;
      }

      .settings-row:last-child {
        border-bottom: 0;
      }

      .settings-input-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #616973;
        white-space: nowrap;
      }

      .settings-input {
        width: 72px;
        height: 36px;
        border: 1px solid #dfe4e8;
        border-radius: 12px;
        outline: none;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        appearance: none;
        -webkit-appearance: none;
      }

      .settings-input:focus {
        border-color: var(--wechat);
      }

      .settings-actions {
        padding: 14px 20px 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .settings-cancel,
      .settings-save {
        min-height: 44px;
        border: 0;
        border-radius: 16px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
      }

      .settings-cancel {
        color: #59616a;
        background: var(--soft);
      }

      .settings-save {
        color: #fff;
        background: var(--wechat);
      }

      .image-preview {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
        background: rgba(0, 0, 0, 0.72);
        overflow: auto;
        text-align: center;
      }

      .image-preview.show {
        display: block;
      }

      .preview-close {
        position: sticky;
        top: 0;
        margin: 0 auto 8px;
        min-height: 36px;
        border: 0;
        border-radius: 999px;
        padding: 0 18px;
        color: #fff;
        background: rgba(255, 255, 255, 0.18);
        font-size: 15px;
        font-weight: 800;
      }

      .image-preview img {
        width: auto;
        max-width: 100%;
        max-height: calc(100dvh - 82px);
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.26);
        background: #fff;
      }

      .image-preview p {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: 14px;
        font-weight: 700;
      }

      /* 移除所有媒体查询，以 iPhone 17 Pro Max (440px) 的布局为准，通过缩放适配 */
    </style>
  </head>
  <body>
    <div id="app-wrapper">
      <main class="page">
      <section class="hero">
        <h1>👨‍🏫董老师羽毛球俱乐部</h1>
        <div class="main-amount">
          <strong class="amount-value" id="mainAmountText">每人应付：¥0</strong>
        </div>
        <p class="amount-tip" id="amountTip">女生球费减半</p>
      </section>

      <section class="content">
        <section class="card mode-card">
          <div class="mode-switch" aria-label="分摊模式">
            <button class="mode-btn" id="equalModeBtn" type="button">全场AA</button>
            <button class="mode-btn active" id="halfModeBtn" type="button">女球减半</button>
          </div>
        </section>

        <section class="card form-card">
          <div class="input-row">
            <span>🏟️ 场地：</span>
            <div class="row-content">
              <input class="inline-input short" id="courtCount" type="number" min="0" max="999" step="1" value="2" />
              <span>小时场地</span>
              
              <span>，</span>
              <input class="inline-input" id="hourlyPrice" type="number" min="0" max="999" step="1" value="40" />
              <span>元/小时</span>
            </div>
          </div>

          <div class="input-row">
            <span>🏸 球费：</span>
            <div class="row-content">
              <input class="inline-input" id="tubePrice" type="number" min="0" max="999" step="1" value="66" />
              <span>元/桶，用了</span>
              <input class="inline-input short" id="usedBalls" type="number" min="0" max="999" step="1" />
              <span>个</span>
            </div>
          </div>

          <div class="input-row people-row" id="peopleRow">
            <span>👥 人数：</span>
            <div class="row-content">
              <span class="male-label" id="maleLabel">男生：</span>
              <input class="inline-input short" id="maleCount" type="number" min="0" max="999" step="1" />
              <span>人</span>
              <span class="female-person">，女生：</span>
              <input class="inline-input short female-person" id="femaleCount" type="number" min="0" max="999" step="1" />
              <span class="female-person">人</span>
            </div>
          </div>

          <div class="summary-detail">
            <div class="summary-info-card">
              <div class="summary-item">
                <div class="summary-icon-box">🏟️</div>
                <span id="courtSummaryText">场地费：0 元，人均 0 元</span>
              </div>
              <div class="summary-item">
                <div class="summary-icon-box">🏸</div>
                <span id="ballSummaryText">球费：0 元，人均 0 元</span>
              </div>

    <script>
      // 页面自适应缩放逻辑：以 iPhone 17 Pro Max (440px) 为基准进行等比缩放
      function handleResize() {
        const designWidth = 440;
        const screenWidth = window.innerWidth;
        const scale = screenWidth / designWidth;
        const wrapper = document.getElementById('app-wrapper');
        
        if (wrapper) {
          wrapper.style.transform = `scale(${scale})`;
          // 设置 body 高度以撑开滚动条
          // wrapper.offsetHeight 是未缩放前的高度，乘以 scale 得到实际占用的屏幕高度
          document.body.style.height = (wrapper.offsetHeight * scale) + 'px';
        }
      }

      window.addEventListener('resize', handleResize);
      window.addEventListener('load', handleResize);
      // 定时检查高度变化（例如内容动态更新时）
      // setInterval(handleResize, 1000); // 已经在 calculate 中调用，这里可以去掉或保留作为兜底

      const fields = {
        clubTitle: document.querySelector(".hero h1"),
        courtCount: document.getElementById("courtCount"),
        hourlyPrice: document.getElementById("hourlyPrice"),
        tubePrice: document.getElementById("tubePrice"),
        usedBalls: document.getElementById("usedBalls"),
        maleCount: document.getElementById("maleCount"),
        femaleCount: document.getElementById("femaleCount"),
      };

      const modeButtons = {
        equal: document.getElementById("equalModeBtn"),
        half: document.getElementById("halfModeBtn"),
      };

      const output = {
        mainAmountText: document.getElementById("mainAmountText"),
        amountTip: document.getElementById("amountTip"),
        peopleRow: document.getElementById("peopleRow"),
        courtSummaryText: document.getElementById("courtSummaryText"),
        ballSummaryText: document.getElementById("ballSummaryText"),
        summaryTotalText: document.getElementById("summaryTotalText"),
      };

      const generateImageBtn = document.getElementById("generateImageBtn");
      const imagePreview = document.getElementById("imagePreview");
      const closePreviewBtn = document.getElementById("closePreviewBtn");
      const generatedImage = document.getElementById("generatedImage");
      const includeQrInImage = document.getElementById("includeQrInImage");
      const qrUploadCard = document.getElementById("qrUploadCard");
      const qrFileInput = document.getElementById("qrFileInput");
      const qrPreviewImage = document.getElementById("qrPreviewImage");
      const qrUploadStatus = document.getElementById("qrUploadStatus");
      const qrClearBtn = document.getElementById("qrClearBtn");
      const openSettingsBtn = document.getElementById("openSettingsBtn");
      const settingsPanel = document.getElementById("settingsPanel");
      const closeSettingsBtn = document.getElementById("closeSettingsBtn");
      const cancelSettingsBtn = document.getElementById("cancelSettingsBtn");
      const saveSettingsBtn = document.getElementById("saveSettingsBtn");
      const defaultFields = {
        clubTitle: document.getElementById("defaultClubTitle"),
        courtCount: document.getElementById("defaultCourtCount"),
        hourlyPrice: document.getElementById("defaultHourlyPrice"),
        tubePrice: document.getElementById("defaultTubePrice"),
        maleCount: document.getElementById("defaultMaleCount"),
        femaleCount: document.getElementById("defaultFemaleCount"),
      };
      const defaultModeButtons = {
        equal: document.getElementById("defaultEqualModeBtn"),
        half: document.getElementById("defaultHalfModeBtn"),
      };

      let splitMode = "half";
      let defaultSplitMode = "half";
      let uploadedQrDataUrl = "";
      const defaultStorageKey = "badmintonReceiptDefaults";
      const qrStorageKey = "badmintonReceiptQrImage";
      const originalClubTitle = fields.clubTitle.textContent;

      function validTitleValue(value) {
        return String(value ?? "").trim().slice(0, 24);
      }

      function validDefaultValue(value) {
        const text = String(value ?? "").trim();
        const number = Number(text);
        return text !== "" && Number.isFinite(number) && number >= 0 ? text : "";
      }

      function valueForPage(value) {
        return Number(value) > 0 ? String(value) : "";
      }

      function validSplitMode(value) {
        return value === "equal" || value === "half" ? value : "half";
      }

      function readCookieValue(name) {
        const target = `${name}=`;
        const parts = document.cookie ? document.cookie.split("; ") : [];
        const match = parts.find((part) => part.indexOf(target) === 0);
        return match ? decodeURIComponent(match.slice(target.length)) : "";
      }

      function readSavedDefaults() {
        let raw = "";
        try {
          raw = localStorage.getItem(defaultStorageKey) || "";
        } catch (error) {
          raw = "";
        }

        if (!raw) {
          raw = readCookieValue(defaultStorageKey);
        }

        if (!raw) return null;

        try {
          const parsed = JSON.parse(raw);
          return {
            clubTitle: validTitleValue(parsed.clubTitle),
            courtCount: validDefaultValue(parsed.courtCount),
            hourlyPrice: validDefaultValue(parsed.hourlyPrice),
            tubePrice: validDefaultValue(parsed.tubePrice),
            maleCount: validDefaultValue(parsed.maleCount),
            femaleCount: validDefaultValue(parsed.femaleCount),
            splitMode: validSplitMode(parsed.splitMode),
          };
        } catch (error) {
          return null;
        }
      }

      function saveDefaults(defaults) {
        const payload = JSON.stringify(defaults);
        try {
          localStorage.setItem(defaultStorageKey, payload);
        } catch (error) {
          // 微信环境下 localStorage 通常可用；失败时仍保留 cookie 兜底。
        }
        document.cookie = `${defaultStorageKey}=${encodeURIComponent(payload)}; max-age=31536000; path=/; SameSite=Lax`;
      }

      function saveUploadedQr(dataUrl) {
        try {
          if (dataUrl) {
            localStorage.setItem(qrStorageKey, dataUrl);
          } else {
            localStorage.removeItem(qrStorageKey);
          }
        } catch (error) {
          alert("收款码图片较大，浏览器本地缓存失败。可以换一张更小的二维码图片。");
        }
      }

      function applyUploadedQr(dataUrl) {
        uploadedQrDataUrl = dataUrl || "";
        if (uploadedQrDataUrl) {
          qrPreviewImage.src = uploadedQrDataUrl;
          qrUploadCard.classList.add("has-image");
          qrUploadStatus.textContent = "已上传，勾选生成带二维码图片时会使用这个收款码";
        } else {
          qrPreviewImage.removeAttribute("src");
          qrUploadCard.classList.remove("has-image");
          qrUploadStatus.textContent = "未上传时，勾选后会使用默认二维码";
        }
      }

      function applySavedQr() {
        let dataUrl = "";
        try {
          dataUrl = localStorage.getItem(qrStorageKey) || "";
        } catch (error) {
          dataUrl = "";
        }
        applyUploadedQr(dataUrl);
      }

      function applySavedDefaults() {
        const defaults = readSavedDefaults();
        if (!defaults) return;

        defaultSplitMode = defaults.splitMode;
        splitMode = defaults.splitMode;
        modeButtons.equal.classList.toggle("active", splitMode === "equal");
        modeButtons.half.classList.toggle("active", splitMode === "half");

        fields.clubTitle.textContent = defaults.clubTitle || originalClubTitle;

        ["courtCount", "hourlyPrice", "tubePrice", "maleCount", "femaleCount"].forEach((key) => {
          if (defaults[key] !== undefined) {
            fields[key].value = valueForPage(defaults[key]);
          }
        });
      }

      function syncSettingsInputs() {
        defaultFields.clubTitle.value = fields.clubTitle.textContent;
        defaultFields.courtCount.value = fields.courtCount.value;
        defaultFields.hourlyPrice.value = fields.hourlyPrice.value;
        defaultFields.tubePrice.value = fields.tubePrice.value;
        defaultFields.maleCount.value = fields.maleCount.value;
        defaultFields.femaleCount.value = fields.femaleCount.value;
        defaultModeButtons.equal.classList.toggle("active", defaultSplitMode === "equal");
        defaultModeButtons.half.classList.toggle("active", defaultSplitMode === "half");
      }

      function setDefaultMode(nextMode) {
        defaultSplitMode = validSplitMode(nextMode);
        defaultModeButtons.equal.classList.toggle("active", defaultSplitMode === "equal");
        defaultModeButtons.half.classList.toggle("active", defaultSplitMode === "half");
      }

      function openSettings() {
        syncSettingsInputs();
        settingsPanel.classList.add("show");
        if (typeof handleResize === 'function') handleResize();
      }

      function closeSettings() {
        settingsPanel.classList.remove("show");
        if (typeof handleResize === 'function') handleResize();
      }

      function handleSaveSettings() {
        const defaults = {
          clubTitle: validTitleValue(defaultFields.clubTitle.value),
          courtCount: validDefaultValue(defaultFields.courtCount.value),
          hourlyPrice: validDefaultValue(defaultFields.hourlyPrice.value),
          tubePrice: validDefaultValue(defaultFields.tubePrice.value),
          maleCount: validDefaultValue(defaultFields.maleCount.value),
          femaleCount: validDefaultValue(defaultFields.femaleCount.value),
          splitMode: defaultSplitMode,
        };

        const hasInvalidValue = ["courtCount", "hourlyPrice", "tubePrice", "maleCount", "femaleCount"].some((key) => {
          const rawValue = defaultFields[key].value;
          return rawValue !== "" && defaults[key] === "";
        });
        if (hasInvalidValue) {
          alert("默认参数只能填写 0 或正数");
          return;
        }

        saveDefaults(defaults);
        fields.clubTitle.textContent = defaults.clubTitle || originalClubTitle;
        setMode(defaults.splitMode);
        fields.courtCount.value = valueForPage(defaults.courtCount);
        fields.hourlyPrice.value = valueForPage(defaults.hourlyPrice);
        fields.tubePrice.value = valueForPage(defaults.tubePrice);
        fields.maleCount.value = valueForPage(defaults.maleCount);
        fields.femaleCount.value = valueForPage(defaults.femaleCount);
        calculate();
        closeSettings();
      }

      function numberValue(input) {
        const value = Number(input.value);
        return Number.isFinite(value) && value > 0 ? value : 0;
      }

      function money(value) {
        if (!Number.isFinite(value)) return "0";
        return Number.isInteger(value) ? String(value) : value.toFixed(1);
      }

      function yuan(value) {
        return `¥${money(value)}`;
      }

      function calculate() {
        const courtCount = numberValue(fields.courtCount);
        const hourlyPrice = numberValue(fields.hourlyPrice);
        const tubePrice = numberValue(fields.tubePrice);
        const usedBalls = numberValue(fields.usedBalls);
        const maleCount = numberValue(fields.maleCount);
        const femaleCount = numberValue(fields.femaleCount);
        const courtTotal = courtCount * hourlyPrice;
        const ballTotal = (tubePrice / 12) * usedBalls;
        const totalPeopleCount = maleCount + (splitMode === "equal" ? 0 : femaleCount);
        const courtEach = totalPeopleCount > 0 ? courtTotal / totalPeopleCount : 0;
        const ballUnits = splitMode === "half" ? maleCount + femaleCount * 0.5 : totalPeopleCount;

        const maleBallEach = ballUnits > 0 ? ballTotal / ballUnits : 0;
        const femaleBallEach = splitMode === "half" ? maleBallEach * 0.5 : maleBallEach;
        const grandTotal = courtTotal + ballTotal;
        const malePay = Math.ceil((courtEach + maleBallEach) * 10) / 10;
        const femalePay = Math.ceil((courtEach + femaleBallEach) * 10) / 10;
        const equalPay = totalPeopleCount > 0 ? Math.ceil((grandTotal / totalPeopleCount) * 10) / 10 : 0;
  
        output.courtSummaryText.textContent = `场地：${money(courtTotal)} 元，人均 ${money(courtEach)} 元`;
        output.ballSummaryText.textContent = `球费：${money(ballTotal)} 元，人均 ${money(totalPeopleCount > 0 ? ballTotal / totalPeopleCount : 0)} 元`;
        output.summaryTotalText.textContent = money(grandTotal);
  
        output.peopleRow.classList.toggle("equal", splitMode === "equal");

        if (splitMode === "equal") {
          output.mainAmountText.innerHTML = `<span class="amount-label-small">每人应付：</span>${yuan(equalPay)}`;
          output.amountTip.textContent = "球费+场地费，全场 AA";
        } else {
          output.mainAmountText.innerHTML = `<span class="amount-label-small">男：</span>${yuan(malePay)}<span class="amount-sep">/</span><span class="amount-label-small">女：</span>${yuan(femalePay)}`;
          output.amountTip.textContent = "场地全场 AA，女生球费减半";
        }
        
        // 重新计算缩放，以防内容高度变化
        if (typeof handleResize === 'function') handleResize();
      }

      function setMode(nextMode) {
        splitMode = nextMode;
        modeButtons.equal.classList.toggle("active", splitMode === "equal");
        modeButtons.half.classList.toggle("active", splitMode === "half");
        calculate();
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function handleQrUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          alert("请选择图片格式的收款码");
          qrFileInput.value = "";
          return;
        }

        uploadedQrDataUrl = await readFileAsDataUrl(file);
        applyUploadedQr(uploadedQrDataUrl);
        saveUploadedQr(uploadedQrDataUrl);
        if (typeof handleResize === 'function') handleResize();
      }

      function clearUploadedQr() {
        qrFileInput.value = "";
        applyUploadedQr("");
        saveUploadedQr("");
        if (typeof handleResize === 'function') handleResize();
      }

      Object.values(fields).forEach((field) => {
        field.addEventListener("input", calculate);
      });

      modeButtons.equal.addEventListener("click", () => setMode("equal"));
      modeButtons.half.addEventListener("click", () => setMode("half"));
      openSettingsBtn.addEventListener("click", openSettings);
      closeSettingsBtn.addEventListener("click", closeSettings);
      cancelSettingsBtn.addEventListener("click", closeSettings);
      saveSettingsBtn.addEventListener("click", handleSaveSettings);
      qrFileInput.addEventListener("change", handleQrUpload);
      qrClearBtn.addEventListener("click", clearUploadedQr);
      defaultModeButtons.equal.addEventListener("click", () => setDefaultMode("equal"));
      defaultModeButtons.half.addEventListener("click", () => setDefaultMode("half"));
      settingsPanel.addEventListener("click", (event) => {
        if (event.target === settingsPanel) closeSettings();
      });

      applySavedDefaults();
      applySavedQr();
      calculate();

      async function generateReceiptImage() {
        const page = document.querySelector(".page");
        
        const width = page.offsetWidth;
        const clone = page.cloneNode(true);
        clone.classList.add("capture-source");
        // 关键：移除克隆节点的最小高度和底部间距，确保紧贴内容
        clone.style.minHeight = "auto";
        clone.style.paddingBottom = "20px"; // 只保留少许边距美观
        clone.style.height = "auto";
        
        // 隐藏不需要出现在图片中的元素
        const actionArea = clone.querySelector(".generate-action");
        if (actionArea) actionArea.style.display = "none";
        
        const modeSwitch = clone.querySelector(".mode-switch");
        if (modeSwitch) modeSwitch.style.display = "none";

        const uploadCard = clone.querySelector(".qr-upload-card");
        if (uploadCard) uploadCard.style.display = "none";

        const receiptQr = clone.querySelector(".receipt-qr");
        const shouldIncludeQr = includeQrInImage.checked;
        if (receiptQr && shouldIncludeQr) {
          const qrSource = uploadedQrDataUrl || receiptQr.src;
          await readImage(qrSource);
          const qrCard = document.createElement("section");
          qrCard.className = "generated-qr-card";
          const qrBox = document.createElement("div");
          qrBox.className = "generated-qr-box";
          const qrImage = document.createElement("img");
          qrImage.src = qrSource;
          qrImage.alt = "收款二维码";
          qrImage.style.display = "block";
          qrImage.style.width = "100%";
          qrImage.style.height = "auto";
          qrBox.appendChild(qrImage);
          const randomBetween = (min, max) => min + Math.random() * (max - min);
          ["left", "right"].forEach((side) => {
            Array.from({ length: 10 }).forEach((_, index) => {
              const emoji = document.createElement("span");
              emoji.className = "qr-emoji";
              emoji.textContent = "🏸";
              Object.assign(emoji.style, {
                [side]: `${randomBetween(8, 52)}px`,
                top: `${8 + index * 8.8 + randomBetween(-2, 2)}%`,
                fontSize: `${randomBetween(14, 23)}px`,
                opacity: String(randomBetween(0.45, 0.78)),
                transform: `rotate(${randomBetween(-35, 35)}deg)`,
              });
              qrCard.appendChild(emoji);
            });
          });
          qrCard.appendChild(qrBox);
          const content = clone.querySelector(".content");
          if (content) {
            content.insertAdjacentElement("beforebegin", qrCard);
            clone.classList.add("with-receipt-qr");
          }
        }

        clone.querySelectorAll("input").forEach((input) => {
          // 获取原始输入框的显示状态
          const originalInput = page.querySelector(`#${input.id}`);
          const isHidden = originalInput && window.getComputedStyle(originalInput).display === 'none';
          
          const span = document.createElement("span");
          span.textContent = input.value || "0";
          span.className = input.className;
          span.style.borderBottom = "1px solid #ddd";
          span.style.display = isHidden ? "none" : "inline-block";
          span.style.minWidth = "4ch";
          span.style.textAlign = "center";
          span.style.verticalAlign = "baseline";
          span.style.lineHeight = "1";
          input.parentNode.replaceChild(span, input);
        });

        const wrapper = document.createElement("div");
        wrapper.style.position = "fixed";
        wrapper.style.left = "-99999px";
        wrapper.style.top = "0";
        wrapper.style.width = `${width}px`;
        wrapper.appendChild(clone);
        document.body.appendChild(wrapper);

        // 使用 getBoundingClientRect 获取精确的内容高度
        const contentHeight = clone.getBoundingClientRect().height;
        const height = Math.ceil(contentHeight);
        
        const css = Array.from(document.querySelectorAll("style"))
          .map((style) => style.textContent)
          .join("\n");
        const markup = new XMLSerializer().serializeToString(clone);
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
            <foreignObject width="100%" height="100%">
              <div xmlns="http://www.w3.org/1999/xhtml">
                <style>${css}</style>
                ${markup}
              </div>
            </foreignObject>
          </svg>
        `;
        wrapper.remove();

        const image = await readImage(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`);
        if (!image) {
          throw new Error("图片生成失败");
        }

        const scale = 2; // 固定 2 倍清晰度
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.fillStyle = "#f5f6f7";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(image, 0, 0, width, height);

        // 4. 处理导出
        try {
          const dataUrl = canvas.toDataURL("image/png");
          generatedImage.src = dataUrl;
          imagePreview.classList.add("show");
        } catch (e) {
          console.error("Canvas 导出失败:", e);
          throw e;
        }
      }

      function readImage(src) {
        return new Promise((resolve) => {
          if (!src) {
            resolve(null);
            return;
          }
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = src;
        });
      }



      generateImageBtn.addEventListener("click", async () => {
        if (includeQrInImage.checked && !uploadedQrDataUrl) {
          alert("请在默认参数里面上传二维码");
          return;
        }
        generateImageBtn.disabled = true;
        generateImageBtn.textContent = "生成中...";
        try {
          await generateReceiptImage();
          generateImageBtn.textContent = "重新生成图片";
        } catch (error) {
          console.error("生成失败详情:", error);
          alert("生成图片失败: " + error.message);
          generateImageBtn.textContent = "生成图片";
        } finally {
          generateImageBtn.disabled = false;
        }
      });

      closePreviewBtn.addEventListener("click", () => {
        imagePreview.classList.remove("show");
      });
    </script>
  </body>
</html>
