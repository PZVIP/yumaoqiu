<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11b96a" />
    <title>羽毛球活动收款</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="top-panel">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">羽</span>
          <h1 id="clubTitle">董老师羽毛球俱乐部</h1>
        </div>

        <div class="total-block" aria-live="polite">
          <span class="total-label">每人应付</span>
          <strong id="mainAmount">¥0</strong>
          <span id="payNote" class="total-note">女生球费减半</span>
        </div>
      </section>

      <section class="content-panel" aria-label="费用计算器">
        <div class="mode-switch" role="group" aria-label="分摊模式">
          <button class="mode-button active" type="button" data-mode="femaleHalf">
            全场AA 女球减半
          </button>
          <button class="mode-button" type="button" data-mode="equal">
            全场AA
          </button>
        </div>

        <form class="fee-form" id="feeForm">
          <label class="field-row">
            <span>场地时长</span>
            <span class="input-unit">
              <input id="hours" name="hours" inputmode="decimal" min="0" step="0.5" type="number" />
              <em>小时</em>
            </span>
          </label>

          <label class="field-row">
            <span>场地单价</span>
            <span class="input-unit">
              <input id="courtPrice" name="courtPrice" inputmode="decimal" min="0" step="1" type="number" />
              <em>元/小时</em>
            </span>
          </label>

          <label class="field-row">
            <span>球价</span>
            <span class="input-unit">
              <input id="shuttlePrice" name="shuttlePrice" inputmode="decimal" min="0" step="1" type="number" />
              <em>元/桶</em>
            </span>
          </label>

          <label class="field-row">
            <span>用球数量</span>
            <span class="input-unit">
              <input id="shuttleCount" name="shuttleCount" inputmode="decimal" min="0" step="0.5" type="number" />
              <em>桶</em>
            </span>
          </label>

          <label class="field-row">
            <span>男生人数</span>
            <span class="input-unit">
              <input id="maleCount" name="maleCount" inputmode="numeric" min="0" step="1" type="number" />
              <em>人</em>
            </span>
          </label>

          <label class="field-row">
            <span>女生人数</span>
            <span class="input-unit">
              <input id="femaleCount" name="femaleCount" inputmode="numeric" min="0" step="1" type="number" />
              <em>人</em>
            </span>
          </label>
        </form>

        <section class="summary-grid" aria-label="费用明细">
          <article class="summary-item">
            <span>场地费</span>
            <strong id="courtTotal">0 元</strong>
            <small id="courtAverage">人均 0 元</small>
          </article>
          <article class="summary-item">
            <span>球费</span>
            <strong id="shuttleTotal">0 元</strong>
            <small id="shuttleAverage">人均 0 元</small>
          </article>
          <article class="summary-item total">
            <span>总计</span>
            <strong id="grandTotal">0 元</strong>
            <small id="peopleTotal">0 人</small>
          </article>
        </section>

        <div class="actions-row">
          <button class="primary-action" id="shareButton" type="button">生成图片并分享</button>
          <button class="secondary-action" id="settingsButton" type="button">设置默认参数</button>
        </div>
      </section>
    </main>

    <dialog id="settingsDialog" class="sheet-dialog">
      <form method="dialog" class="sheet">
        <div class="sheet-title">
          <strong>设置默认参数</strong>
          <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
        </div>

        <label class="field-row">
          <span>默认标题</span>
          <span class="input-unit full">
            <input id="defaultTitle" maxlength="24" type="text" />
          </span>
        </label>

        <label class="field-row">
          <span>默认模式</span>
          <select id="defaultMode">
            <option value="femaleHalf">全场AA 女球减半</option>
            <option value="equal">全场AA</option>
          </select>
        </label>

        <label class="field-row">
          <span>默认时长</span>
          <span class="input-unit">
            <input id="defaultHours" inputmode="decimal" min="0" step="0.5" type="number" />
            <em>小时</em>
          </span>
        </label>

        <label class="field-row">
          <span>场地单价</span>
          <span class="input-unit">
            <input id="defaultCourtPrice" inputmode="decimal" min="0" step="1" type="number" />
            <em>元/小时</em>
          </span>
        </label>

        <label class="field-row">
          <span>每桶球价</span>
          <span class="input-unit">
            <input id="defaultShuttlePrice" inputmode="decimal" min="0" step="1" type="number" />
            <em>元/桶</em>
          </span>
        </label>

        <label class="field-row">
          <span>男生人数</span>
          <span class="input-unit">
            <input id="defaultMaleCount" inputmode="numeric" min="0" step="1" type="number" />
            <em>人</em>
          </span>
        </label>

        <label class="field-row">
          <span>女生人数</span>
          <span class="input-unit">
            <input id="defaultFemaleCount" inputmode="numeric" min="0" step="1" type="number" />
            <em>人</em>
          </span>
        </label>

        <div class="sheet-actions">
          <button class="secondary-action" value="cancel" type="submit">取消</button>
          <button class="primary-action" id="saveDefaults" value="default" type="button">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="receiptDialog" class="receipt-dialog">
      <form method="dialog" class="receipt-sheet">
        <div class="sheet-title">
          <strong>收款图片</strong>
          <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
        </div>
        <img id="receiptImage" alt="活动收款图片" />
        <div class="sheet-actions">
          <button class="secondary-action" value="cancel" type="submit">关闭</button>
          <button class="primary-action" id="downloadButton" value="default" type="button">保存图片</button>
        </div>
      </form>
    </dialog>

    <script src="./script.js" defer></script>
  </body>
</html>
